# Include inside nginx's http {} context. Replace server_name before enabling.
# TLS is terminated by the CDN/load balancer. Bind Next to 127.0.0.1:3000.
# Without a CDN this listener must not be exposed directly to the internet.
# With a CDN, configure set_real_ip_from for ONLY that provider's trusted CIDRs
# and its documented real_ip_header, or rate limits will group proxy clients.
limit_req_zone $binary_remote_addr zone=fullback_pages:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=fullback_connections:10m;
upstream fullback {
    server 127.0.0.1:3000;
    keepalive 32;
}
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn fullback_connections 40;

    # No API exists yet. Keep costly paths closed until backend protections exist.
    location ^~ /api/ { return 404; }
    # All image variants are pre-generated; no on-demand image CPU work.
    location = /_next/image { return 404; }
    location ~ ^/(media|fonts|images|_next/static)/ {
        proxy_pass http://fullback;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }
    location / {
        limit_req zone=fullback_pages burst=40 nodelay;
        proxy_pass http://fullback;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        proxy_connect_timeout 3s;
        # Preserve Next's Cache-Control and Vary (including RSC variants).
        # Do not force public caching of all HTML or future authenticated data.
    }
}
