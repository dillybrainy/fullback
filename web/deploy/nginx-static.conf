# Include in http {}. Copy web/out into /srv/fullback and replace server_name.
# Reference origin behind a TLS CDN; configure origin access at your provider.
# Configure set_real_ip_from with ONLY trusted CDN/proxy CIDRs and the provider's
# real_ip_header before using per-client limits; never trust arbitrary XFF.
limit_req_zone $binary_remote_addr zone=fullback_static_pages:10m rate=20r/s;
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root /srv/fullback;
    index index.html;
    include mime.types;
    charset utf-8;
    sendfile on;
    tcp_nopush on;
    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    error_page 404 /404.html;
    # Segment payloads create route-named directories. Prefer route.html,
    # and canonicalize trailing slashes before the directory can win.
    rewrite ^/(.+)/$ /$1 permanent;
    location ^~ /api/ { return 404; }
    location = /_next/image { return 404; }
    location ~ ^/(media|_next/static)/ {
        try_files $uri =404;
        # These file names are content-hashed.
        expires 1y;
        # expires already adds max-age; add immutable as an additional directive.
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }
    location ~ ^/(fonts|images)/ {
        try_files $uri =404;
        expires 1d;
        add_header X-Content-Type-Options nosniff;
    }
    location / {
        limit_req zone=fullback_static_pages burst=40 nodelay;
        try_files $uri.html $uri $uri/ =404;
        # Revalidate documents across deploys; CDN policy may cache by release.
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }
}
