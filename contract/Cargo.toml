[package]
name = "fullback"
version = "0.1.0"
edition = "2021"
description = "FULLBACK: transfer agreements that collect installments, hold collateral and split payouts on NEAR testnet."
license = "MIT"
repository = "https://github.com/"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[workspace]
members = ["ft"]
default-members = [".", "ft"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
